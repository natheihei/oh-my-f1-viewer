# Packages the app: `npm run dist`, after `npm run build`. See docs/RELEASE.md.
#
# The name stays oh-my-f1-viewer: Electron names the profile folder after it (~/.config/oh-my-f1-viewer), and the OS
# keystore entry that decrypts the saved F1 TV and agent logins. A packaged app then shares a source run's profile.
appId: run.yueyao.oh-my-f1-viewer
productName: oh-my-f1-viewer
artifactName: omfv-${version}-${os}-${arch}.${ext}

# castLabs' Widevine build, already in node_modules for this platform: each platform is packaged on its own.
electronDist: node_modules/electron/dist

# Mac afterPack patches Squirrel.framework's ShipIt (Squirrel.Mac#331) and VMP-signs the app through castLabs' EVS
# before Apple signing seals it. Windows VMP-signs in afterSign after the .exe is edited and signed.
afterPack: build/after-pack.js
afterSign: build/vmp-sign-win.js

directories:
  output: release

files:
  - dist/**
  - dist-electron/**
  - icons/omfv-app-icon.png
  - package.json
  - '!**/*.map'
  - '!**/*.test.*'

# The mods code copies these into the mods folder, so they sit next to app.asar as plain files: see electron/appFiles.ts.
extraResources:
  - from: dist-types
    to: dist-types
  - from: src/components
    to: components
    filter: ['**/*', '!**/*.test.*']

# esbuild compiles mods by spawning its native binary, which can't run from inside app.asar.
asarUnpack:
  - node_modules/esbuild/**
  - node_modules/@esbuild/**

# Where an installed AppImage, Mac app or Windows app looks for the next release (electron/updates.ts): the release marked latest.
# electron-builder writes latest-linux.yml, latest-mac.yml and latest.yml (Windows) from it, and app-update.yml into the app. The release
# action uploads them; `--publish never` keeps electron-builder from uploading anything itself.
publish:
  provider: generic
  url: https://github.com/natheihei/oh-my-f1-viewer/releases/latest/download

linux:
  target:
    - pacman # Omarchy, and Arch: `sudo pacman -U`
    - AppImage # other distributions
  executableName: oh-my-f1-viewer
  # The Mac and Linux icon: the tile on Apple's grid, with rounded corners and a shadow. It's omfv-app-icon.svg at
  # 1024px with a transparent background; render it again when the SVG changes.
  icon: icons/omfv-app-icon.png
  category: AudioVideo
  synopsis: Agent-driven F1 multi-view player
  maintainer: oh-my-f1-viewer
  desktop:
    entry:
      Name: OMFV
      GenericName: F1 viewer
      StartupWMClass: oh-my-f1-viewer

pacman:
  # electron-builder's default list names packages Arch doesn't have any more (http-parser), so pacman refuses it.
  # Electron brings its own libraries: these are what the binary links to, plus libsecret for the saved logins.
  depends: [gtk3, nss, alsa-lib, mesa, libcups, libsecret, xdg-utils]

mac:
  target:
    - target: dmg # to install
      arch: arm64
    - target: zip # what an update installs: Squirrel.Mac takes a zip
      arch: arm64
  icon: icons/omfv-app-icon.png
  category: public.app-category.entertainment
  # Ad-hoc signed here, for `npm run dist`: without a signature at all, Apple silicon won't run it. A release is
  # signed with OMFV's Developer ID instead, and notarized: the action passes the identity, and electron-builder
  # notarizes when the APPLE_API_KEY variables are set. See the workflow and docs/RELEASE.md.
  identity: '-'
  # Notarizing requires the hardened runtime. The entitlements let V8 and the downloaded Widevine CDM run under it.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    CFBundleDisplayName: OMFV

win:
  target:
    - target: nsis # to install, and what an update installs
      arch: x64
  # electron-builder makes the .ico from it. Editing the .exe's icon and details needs Windows, or Wine elsewhere.
  icon: icons/omfv-app-icon.png
  # No Authenticode certificate yet: the .exe is unsigned, so SmartScreen warns on the first run.

nsis:
  # Installs for this user, into %LOCALAPPDATA%\Programs, with no admin prompt, so an update can install over it.
  oneClick: true
  perMachine: false
  shortcutName: OMFV
  uninstallDisplayName: OMFV
  # The profile in %APPDATA%\oh-my-f1-viewer, with the sign-ins, stays when the app is removed.
  deleteAppDataOnUninstall: false
