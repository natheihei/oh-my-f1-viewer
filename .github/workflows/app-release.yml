# Builds OMFV's installable files for Linux, macOS and Windows and releases them. See docs/RELEASE.md.
#
# - Run by hand with a commit on main (a SHA, or `main`): builds it, tags it `app-YYYYMMDD.N` and publishes a GitHub
#   release named for the date and run, with the files attached. `dry_run` builds and keeps the files as the run's
#   artifacts, with no tag and no release.
# - A pull request that changes the packaging builds every platform the same way, without releasing.
# - Each release carries latest-linux.yml, latest-mac.yml and latest.yml, which installed AppImages, Mac apps and
#   Windows apps read to update themselves (electron/updates.ts), and the Mac zip and Windows installer they install.
name: Release app

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit on main to release: a SHA, or main.'
        required: true
        default: main
      dry_run:
        description: 'Build only: keep the files as artifacts of this run, with no tag and no release.'
        type: boolean
        default: false
      notes:
        description: 'Markdown to put before the generated notes, such as what to do by hand for this release.'
        required: false
        default: ''
  pull_request:
    paths:
      - .github/workflows/app-release.yml
      - electron-builder.yml
      - build/**
      - electron/appFiles.ts
      - electron/updates.ts
      - scripts/packaged-check.mjs
      - package.json
      - package-lock.json

permissions:
  contents: write

concurrency:
  # Releases one at a time, so two runs can't take the same number. A pull request's builds replace each other.
  group: ${{ github.event_name == 'pull_request' && format('app-build-{0}', github.ref) || 'app-release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.version.outputs.commit }}
      name: ${{ steps.version.outputs.name }}
      semver: ${{ steps.version.outputs.semver }}
      previous: ${{ steps.version.outputs.previous }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Name the release
        id: version
        env:
          SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          commit=$(git rev-parse -q --verify "origin/$SHA^{commit}" || git rev-parse -q --verify "$SHA^{commit}") \
            || fail "No commit $SHA."
          if [ "$EVENT" = workflow_dispatch ]; then
            git merge-base --is-ancestor "$commit" origin/main || fail "$SHA ($commit) is not on main."
          fi

          # YYYYMMDD.N: the UTC date, and one more than the day's last release.
          day=$(date -u +%Y%m%d)
          last=$(git tag -l "app-$day.*" | sed "s/^app-$day\.//" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          name="$day.$(( ${last:-0} + 1 ))"
          # The release before, for the notes: release names sort as versions.
          previous=$(git tag -l 'app-*' | sort -V | tail -1 || true)

          {
            echo "commit=$commit"
            echo "name=$name"
            # electron-builder and Electron want semver.
            echo "semver=$name.0"
            echo "previous=$previous"
          } >> "$GITHUB_OUTPUT"
          echo "Building $name from $commit${previous:+, after $previous}."

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
          - platform: mac
            runner: macos-latest # Apple silicon
          - platform: win
            runner: windows-latest # x64
    runs-on: ${{ matrix.runner }}
    # The signing secrets are in an environment for each platform: the Developer ID, the notary key and the EVS account
    # in mac-signing, and the EVS account in windows-signing. Only a run from main can use either, and only once the
    # owner approves it: see docs/RELEASE.md. A pull request's build doesn't ask, signs the Mac app ad-hoc, and VMP-signs
    # neither.
    environment: ${{ github.event_name == 'workflow_dispatch' && (matrix.platform == 'mac' && 'mac-signing' || matrix.platform == 'win' && 'windows-signing') || '' }}
    defaults:
      run:
        # Git's bash on Windows, so every step is the same script.
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.commit }}

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      # fpm, which builds the pacman package, needs bsdtar.
      - name: Install packaging tools
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      # As in the README: the dependencies, then castLabs' Electron build with Widevine, whose install script npm
      # doesn't run by itself.
      - name: Install dependencies
        run: |
          npm ci --allow-git=all
          node node_modules/electron/install.js

      - name: Build
        run: npm run build

      # Every release is signed with OMFV's Developer ID, so Squirrel.Mac installs an update over the app, and the
      # keychain entry holding the sign-ins trusts every release by its Team ID. It's notarized, so Gatekeeper opens a
      # download without asking. electron-builder imports the certificate into a keychain of its own (CSC_LINK), signs
      # as the identity with the Team ID in its name, and notarizes with the API key (APPLE_API_KEY). See docs/RELEASE.md.
      - name: Set up the Developer ID
        if: matrix.platform == 'mac'
        env:
          P12: ${{ secrets.MAC_DEVELOPER_ID_P12 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          RELEASING: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ -z "$P12" ] || [ -z "$TEAM_ID" ] || [ -z "$API_KEY" ]; then
            # A new identity would strand every installed Mac app on the last release, so a release refuses.
            if [ "$RELEASING" = true ]; then
              echo "::error::The Developer ID secrets aren't all set: see docs/RELEASE.md, \"Sign the Mac build\"."
              exit 1
            fi
            echo "::warning::No Developer ID: signed ad-hoc and not notarized. An installed Mac app won't update to this."
            exit 0
          fi
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$API_KEY" > "$RUNNER_TEMP/notary-key.p8"
          {
            echo "CSC_LINK=$RUNNER_TEMP/developer-id.p12"
            echo "APPLE_API_KEY=$RUNNER_TEMP/notary-key.p8"
            echo "SIGN_AS=-c.mac.identity=$TEAM_ID"
            echo "SIGNED_BY=$TEAM_ID"
          } >> "$GITHUB_ENV"

      # castLabs' EVS, which build/vmp-sign.js signs with, on a Mac before the Apple signature and on Windows after the
      # .exe is edited: F1 TV's licence server refuses the development VMP signature castLabs' Electron comes with. The
      # account is in the mac-signing and windows-signing environments.
      - name: Set up VMP signing
        if: matrix.platform != 'linux'
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
          RELEASING: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ -z "$EVS_ACCOUNT_NAME" ] || [ -z "$EVS_PASSWD" ]; then
            # Without it the app can't play a live session, so a release refuses.
            if [ "$RELEASING" = true ]; then
              echo "::error::The EVS secrets aren't set: see docs/RELEASE.md, \"VMP-sign the app\"."
              exit 1
            fi
            echo "::warning::No EVS account: not VMP-signed. This app won't play live sessions or other DRM streams."
            exit 0
          fi
          # Node runs EVS_PYTHON without a shell, so on Windows it names the .exe.
          if [ "$RUNNER_OS" = Windows ]; then
            python -m venv "$RUNNER_TEMP/evs"
            evs_python="$RUNNER_TEMP/evs/Scripts/python.exe"
          else
            python3 -m venv "$RUNNER_TEMP/evs"
            evs_python="$RUNNER_TEMP/evs/bin/python"
          fi
          "$evs_python" -m pip install --quiet castlabs-evs
          {
            echo "EVS_PYTHON=$evs_python"
            echo "VMP_REQUIRED=true"
          } >> "$GITHUB_ENV"

      - name: Package
        env:
          EVS_ACCOUNT_NAME: ${{ matrix.platform != 'linux' && secrets.EVS_ACCOUNT_NAME || '' }}
          EVS_PASSWD: ${{ matrix.platform != 'linux' && secrets.EVS_PASSWD || '' }}
          # Sign as electron-builder.yml says, or as the Developer ID above, without looking in the runner's keychain.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_KEY_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # electron-builder skips signing in a pull request's build unless told not to, so a pull request would check an
          # unsigned app. A fork's pull request gets no secrets, so it signs ad-hoc.
          CSC_FOR_PULL_REQUEST: 'true'
          # The PostHog project's key, for the anonymous usage counts (electron/telemetry.ts, docs/TELEMETRY.md). Only a
          # release gets it: a pull request's or a dry run's build has none, so it never sends.
          POSTHOG_KEY: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run && secrets.POSTHOG_KEY || '' }}
        run: npx electron-builder --${{ matrix.platform }} --publish never -c.extraMetadata.version=${{ needs.version.outputs.semver }} -c.extraMetadata.omfvPosthogKey="$POSTHOG_KEY" ${SIGN_AS:-}

      # An update installs only over an app with the same identity, which for a Developer ID is its Team ID. Ad-hoc,
      # each build's is its own hash. The .dmg is what's downloaded, so its app is the one Gatekeeper has to accept.
      - name: Check the Mac signature
        if: matrix.platform == 'mac'
        run: |
          set -euo pipefail
          app=release/mac-arm64/oh-my-f1-viewer.app
          shipit="$app/Contents/Frameworks/Squirrel.framework/Versions/A/Resources/ShipIt"
          nm -u "$shipit" | grep -q '_SMJobRemove' || { echo "::error::ShipIt is missing _SMJobRemove (Squirrel.Mac#331 patch)."; exit 1; }
          codesign -d -r- "$app" 2>&1 | grep '^designated' || true
          [ -n "${SIGNED_BY:-}" ] || exit 0
          codesign --verify --deep --strict "$app"
          # The next release must satisfy this one's requirement, which names the Team ID, not this build's hash.
          requirement=$(codesign -d -r- "$app" 2>&1 | grep '^designated')
          if ! echo "$requirement" | grep -Eq "subject\.OU\] = \"?$SIGNED_BY\"?"; then
            echo "::error::The designated requirement doesn't name Team ID $SIGNED_BY."
            exit 1
          fi
          codesign -dv "$app" 2>&1 | grep -q 'flags=.*runtime' || { echo "::error::Not signed with the hardened runtime."; exit 1; }
          dmg=$(ls release/*.dmg)
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" "$dmg"
          trap 'hdiutil detach "$RUNNER_TEMP/dmg"' EXIT
          xcrun stapler validate "$RUNNER_TEMP/dmg/oh-my-f1-viewer.app"
          spctl --assess --type execute -vv "$RUNNER_TEMP/dmg/oh-my-f1-viewer.app" 2>&1 | tee "$RUNNER_TEMP/spctl.txt"
          grep -q 'source=Notarized Developer ID' "$RUNNER_TEMP/spctl.txt" || { echo "::error::Gatekeeper doesn't see it as notarized."; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: omfv-${{ needs.version.outputs.name }}-${{ matrix.platform }}
          path: |
            release/*.pacman
            release/*.AppImage
            release/*.dmg
            release/*.zip
            release/*.exe
            release/latest*.yml
          if-no-files-found: error

  release:
    needs: [version, build]
    if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: files
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ needs.version.outputs.commit }}
          NAME: ${{ needs.version.outputs.name }}
          PREVIOUS: ${{ needs.version.outputs.previous }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          cd files
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          notes=()
          if [ -n "$PREVIOUS" ]; then
            # gh puts --notes before the generated ones.
            notes=(--generate-notes --notes-start-tag "$PREVIOUS" ${NOTES:+--notes "$NOTES"})
          else
            notes=(--notes "${NOTES:-The first release of OMFV.}")
          fi
          gh release create "app-$NAME" --repo "$REPO" --target "$COMMIT" --title "OMFV $NAME" --latest "${notes[@]}" -- *
          echo "### [OMFV $NAME](https://github.com/$REPO/releases/tag/app-$NAME) from \`${COMMIT:0:7}\`" >> "$GITHUB_STEP_SUMMARY"
