# Builds OMFV's installable files for Linux and macOS and releases them. See docs/RELEASE.md.
#
# - Run by hand with a commit on main (a SHA, or `main`): builds it, tags it `app-YYYYMMDD.N` and publishes a GitHub
#   release named for the date and run, with the files attached. `dry_run` builds and keeps the files as the run's
#   artifacts, with no tag and no release.
# - A pull request that changes the packaging builds both platforms the same way, without releasing.
# - Each release carries latest-linux.yml and latest-mac.yml, which installed AppImages and Mac apps read to update
#   themselves (electron/updates.ts), and the Mac zip they install.
name: Release app

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit on main to release: a SHA, or main.'
        required: true
        default: main
      dry_run:
        description: 'Build only: keep the files as artifacts of this run, with no tag and no release.'
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/app-release.yml
      - electron-builder.yml
      - electron/appFiles.ts
      - electron/updates.ts
      - package.json
      - package-lock.json

permissions:
  contents: write

concurrency:
  # Releases one at a time, so two runs can't take the same number. A pull request's builds replace each other.
  group: ${{ github.event_name == 'pull_request' && format('app-build-{0}', github.ref) || 'app-release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.version.outputs.commit }}
      name: ${{ steps.version.outputs.name }}
      semver: ${{ steps.version.outputs.semver }}
      previous: ${{ steps.version.outputs.previous }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Name the release
        id: version
        env:
          SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          commit=$(git rev-parse -q --verify "origin/$SHA^{commit}" || git rev-parse -q --verify "$SHA^{commit}") \
            || fail "No commit $SHA."
          if [ "$EVENT" = workflow_dispatch ]; then
            git merge-base --is-ancestor "$commit" origin/main || fail "$SHA ($commit) is not on main."
          fi

          # YYYYMMDD.N: the UTC date, and one more than the day's last release.
          day=$(date -u +%Y%m%d)
          last=$(git tag -l "app-$day.*" | sed "s/^app-$day\.//" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          name="$day.$(( ${last:-0} + 1 ))"
          # The release before, for the notes: release names sort as versions.
          previous=$(git tag -l 'app-*' | sort -V | tail -1 || true)

          {
            echo "commit=$commit"
            echo "name=$name"
            # electron-builder and Electron want semver.
            echo "semver=$name.0"
            echo "previous=$previous"
          } >> "$GITHUB_OUTPUT"
          echo "Building $name from $commit${previous:+, after $previous}."

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
          - platform: mac
            runner: macos-latest # Apple silicon
    runs-on: ${{ matrix.runner }}
    env:
      # OMFV's own signing certificate for macOS, made by scripts/mac-signing-cert.sh. Without it, ad-hoc.
      MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.commit }}

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      # fpm, which builds the pacman package, needs bsdtar.
      - name: Install packaging tools
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      # As in the README: the dependencies, then castLabs' Electron build with Widevine, whose install script npm
      # doesn't run by itself.
      - name: Install dependencies
        run: |
          npm ci --allow-git=all
          node node_modules/electron/install.js

      - name: Build
        run: npm run build

      # Every release signed with the same certificate has the same identity, so Squirrel.Mac installs an update over
      # the app, and the keychain entry holding the sign-ins keeps trusting it. Apple doesn't know the certificate, so
      # it's trusted on the runner for electron-builder to find it; a Mac still asks once, on the first install.
      - name: Trust OMFV's signing certificate
        if: matrix.platform == 'mac' && env.MAC_CERT_P12 != ''
        env:
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/omfv.p12"
          openssl pkcs12 -in "$RUNNER_TEMP/omfv.p12" -passin env:MAC_CERT_PASSWORD -nokeys -out "$RUNNER_TEMP/omfv.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/omfv.pem"
          {
            echo "CSC_LINK=$RUNNER_TEMP/omfv.p12"
            echo "SIGN_AS=-c.mac.identity=OMFV"
          } >> "$GITHUB_ENV"

      - name: Package
        env:
          # Sign as electron-builder.yml says, or as OMFV above, without looking for a Developer ID in the keychain.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: npx electron-builder --${{ matrix.platform }} --publish never -c.extraMetadata.version=${{ needs.version.outputs.semver }} ${SIGN_AS:-}

      # An update installs only over an app with the same identity. Ad-hoc, each build's is its own hash.
      - name: Check the Mac signature
        if: matrix.platform == 'mac'
        run: |
          set -euo pipefail
          app=release/mac-arm64/oh-my-f1-viewer.app
          codesign --verify --deep --strict "$app"
          requirement=$(codesign -d -r- "$app" 2>&1 | grep '^designated')
          echo "$requirement"
          if [ -z "$MAC_CERT_P12" ]; then
            echo "::warning::Signed ad-hoc, without OMFV's certificate: an installed Mac app won't update itself."
          elif echo "$requirement" | grep -q cdhash; then
            echo "::error::Signed ad-hoc although OMFV's certificate was there."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: omfv-${{ needs.version.outputs.name }}-${{ matrix.platform }}
          path: |
            release/*.pacman
            release/*.AppImage
            release/*.dmg
            release/*.zip
            release/latest*.yml
          if-no-files-found: error

  release:
    needs: [version, build]
    if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ needs.version.outputs.commit }}
          NAME: ${{ needs.version.outputs.name }}
          PREVIOUS: ${{ needs.version.outputs.previous }}
        run: |
          set -euo pipefail
          cd files
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          notes=()
          if [ -n "$PREVIOUS" ]; then notes=(--generate-notes --notes-start-tag "$PREVIOUS"); else notes=(--notes "The first release of OMFV."); fi
          gh release create "app-$NAME" --repo "$REPO" --target "$COMMIT" --title "OMFV $NAME" --latest "${notes[@]}" -- *
          echo "### [OMFV $NAME](https://github.com/$REPO/releases/tag/app-$NAME) from \`${COMMIT:0:7}\`" >> "$GITHUB_STEP_SUMMARY"
