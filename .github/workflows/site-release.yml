# Puts a commit of the site into production. Workers Builds builds the `omfv-site` Worker from the
# `site-production` branch, so this moves that branch to the commit. See site/DEPLOY.md.
#
# Run it by hand with a commit on main (a SHA, or `main` for what staging shows now). A commit older than
# what's live rolls production back.
name: Release site

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit on main to put in production: a SHA, or main for what staging shows now. An older commit rolls back.'
        required: true
        default: main

permissions:
  contents: write

concurrency:
  group: site-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Move site-production to the commit
        env:
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          commit=$(git rev-parse -q --verify "origin/$SHA^{commit}" || git rev-parse -q --verify "$SHA^{commit}") \
            || fail "No commit $SHA."

          # Only ship what staging, which builds main, has already shown.
          git merge-base --is-ancestor "$commit" origin/main || fail "$SHA ($commit) is not on main."

          if current=$(git rev-parse -q --verify origin/site-production); then
            if [ "$current" = "$commit" ]; then
              echo "site-production is already at $commit."
              exit 0
            elif git merge-base --is-ancestor "$current" "$commit"; then
              echo "Fast-forwarding site-production from $current to $commit."
              git push origin "$commit:refs/heads/site-production"
            else
              echo "Rolling site-production back from $current to $commit."
              git push --force-with-lease="site-production:$current" origin "$commit:refs/heads/site-production"
            fi
          else
            echo "Creating site-production at $commit."
            git push origin "$commit:refs/heads/site-production"
          fi

          {
            echo "### site-production → \`${commit:0:7}\`"
            echo
            echo "$(git log -1 --format=%s "$commit")"
            echo
            echo "Workers Builds now builds \`omfv-site\` for https://oh-my-f1-viewer.yueyao.run."
          } >> "$GITHUB_STEP_SUMMARY"
